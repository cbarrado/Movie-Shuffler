name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install npm dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Movie Shuffler ${{ github.ref_name }}"
          releaseBody: "Descarga el instalador para tu plataforma desde los archivos adjuntos."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  android:
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 ndk;27.0.12077973"

      - name: Install Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache (android)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: android

      - name: Install npm dependencies
        run: npm ci

      - name: Init Android project
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: npm run tauri android init

      - name: Build Android APK (release, unsigned)
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: npm run tauri android build -- --apk

      - name: Sign APK
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          UNSIGNED=$(find src-tauri/gen/android -name "*unsigned*.apk" | head -1)
          if [ -z "$UNSIGNED" ]; then
            UNSIGNED=$(find src-tauri/gen/android -type f -name "*.apk" | head -1)
          fi
          OUT_DIR=$(dirname "$UNSIGNED")
          SIGNED="$OUT_DIR/movie-shuffler-universal.apk"

          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "Signing with release keystore (your key)"
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$HOME/release.jks"
            KEYSTORE="$HOME/release.jks"
            KEYSTORE_PASS="$ANDROID_KEYSTORE_PASSWORD"
            KEY_ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASS="$ANDROID_KEY_PASSWORD"
          else
            echo "No release keystore secret found. Generating a debug keystore on the fly (installable but not for distribution)."
            KEYSTORE="$HOME/debug.keystore"
            KEYSTORE_PASS=android
            KEY_ALIAS=androiddebugkey
            KEY_PASS=android
            keytool -genkey -v -noprompt \
              -keystore "$KEYSTORE" -storepass "$KEYSTORE_PASS" \
              -alias "$KEY_ALIAS" -keypass "$KEY_PASS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Movie Shuffler Debug, O=Movie Shuffler, C=ES"
          fi

          BUILD_TOOLS=$(ls -d ${ANDROID_HOME}/build-tools/*/ | sort -V | tail -1)
          "${BUILD_TOOLS}zipalign" -f -p 4 "$UNSIGNED" "$OUT_DIR/aligned.apk"
          "${BUILD_TOOLS}apksigner" sign \
            --ks "$KEYSTORE" --ks-pass "pass:$KEYSTORE_PASS" \
            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" \
            --out "$SIGNED" "$OUT_DIR/aligned.apk"
          rm "$OUT_DIR/aligned.apk"
          "${BUILD_TOOLS}apksigner" verify "$SIGNED"
          echo "SIGNED_APK=$SIGNED" >> $GITHUB_ENV

      - name: Upload signed APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploading $SIGNED_APK"
          gh release upload ${{ github.ref_name }} "$SIGNED_APK" --clobber --repo ${{ github.repository }}
